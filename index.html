<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#4f46e5">
  <meta name="description" content="LifeOS — Персональный планировщик жизни, учёбы, ЕГЭ, олимпиад и отдыха для ученика 10 класса">

  <title>LifeOS — Персональный планировщик жизни и учёбы</title>

  <!-- Иконки и PWA Манифест -->
  <link rel="icon" type="image/svg+xml" href="assets/icons/icon.svg">
  <link rel="alternate icon" type="image/png" href="assets/icons/favicon.png">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
  <link rel="manifest" href="manifest.json">

  <!-- Стили приложения -->
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <!-- ВЕРХНЯЯ ШАПКА -->
  <header class="app-header">
    <div class="header-container">
      <div class="brand-area">
        <div class="brand-logo">
          <img src="assets/icons/icon.svg" alt="LifeOS Logo" width="36" height="36">
        </div>
        <div class="brand-text">
          <h1>LifeOS</h1>
          <span class="brand-tagline">10 класс • Учёба, ЕГЭ и Жизнь</span>
        </div>
      </div>

      <!-- Десктопная навигация -->
      <nav class="header-nav">
        <button class="nav-item active" data-view="today">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          Сегодня
        </button>
        <button class="nav-item" data-view="school">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
          Неделя
        </button>
        <button class="nav-item" data-view="homework">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
          Домашка
        </button>
        <button class="nav-item" data-view="goals">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>
          Цели
        </button>
        <button class="nav-item" data-view="statistics">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
          Статистика
        </button>
        <button class="nav-item" data-view="settings">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          Настройки
        </button>
      </nav>

      <!-- Правая область шапки -->
      <div class="header-status-area">
        <div id="header-live-clock" class="clock-badge">--:--:--</div>
        <button class="btn-ai-spark" onclick="App.openAiModal()" title="Открыть ИИ-Помощник LifeOS">
          <span>✨</span>
          <span>ИИ-Агент</span>
        </button>
      </div>
    </div>
  </header>

  <!-- ОСНОВНАЯ ОБЛАСТЬ ЭКРАНОВ -->
  <main class="main-wrapper">
    <!-- 1. СЕГОДНЯ -->
    <section id="view-today" class="view-section active">
      <div id="today-content"></div>
    </section>

    <!-- 2. НЕДЕЛЯ (ШКОЛЬНОЕ РАСПИСАНИЕ) -->
    <section id="view-school" class="view-section">
      <div id="school-content"></div>
    </section>

    <!-- 3. ДОМАШКА -->
    <section id="view-homework" class="view-section">
      <div id="homework-content"></div>
    </section>

    <!-- 4. ЦЕЛИ (ЕГЭ, ОЛИМПИАДЫ, ПРОЕКТЫ) -->
    <section id="view-goals" class="view-section">
      <div id="goals-content"></div>
    </section>

    <!-- 5. СТАТИСТИКА -->
    <section id="view-statistics" class="view-section">
      <div id="statistics-content"></div>
    </section>

    <!-- 6. НАСТРОЙКИ -->
    <section id="view-settings" class="view-section">
      <div id="settings-content"></div>
    </section>
  </main>

  <!-- НИЖНЯЯ ПАНЕЛЬ ДЛЯ СМАРТФОНОВ -->
  <nav class="mobile-bottom-nav">
    <button class="mobile-nav-item active nav-item" data-view="today">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      <span>Сегодня</span>
    </button>
    <button class="mobile-nav-item nav-item" data-view="school">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
      <span>Неделя</span>
    </button>
    <button class="mobile-nav-item nav-item" data-view="homework">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
      <span>Домашка</span>
    </button>
    <button class="mobile-nav-item nav-item" data-view="goals">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>
      <span>Цели</span>
    </button>
    <button class="mobile-nav-item nav-item" data-view="statistics">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
      <span>Аналитика</span>
    </button>
    <button class="mobile-nav-item nav-item" data-view="settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      <span>Опции</span>
    </button>
  </nav>

  <!-- ПОДВАЛ -->
  <footer class="app-footer">
    <div class="footer-container">
      <div>
        <strong>LifeOS v1.2</strong> • Персональная система планирования ученика 10 класса
      </div>
      <div class="footer-tags">
        <span>Актаныш, Татарстан</span>
        <span>Автономный PWA режим</span>
        <span>Локальное хранение (IndexedDB + LocalStorage)</span>
      </div>
    </div>
  </footer>

  <!-- СКРИПТЫ МОДУЛЕЙ -->
  <script src="js/time.js"></script>
  <script src="js/database.js"></script>
  <script src="js/prayer.js"></script>
  <script src="js/scheduler.js"></script>
  <script src="js/ai-planner.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/school.js"></script>
  <script src="js/homework.js"></script>
  <script src="js/goals.js"></script>
  <script src="js/statistics.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
